<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">LLM Syntax Explainer</title>
  <desc id="description">A clean light banner showing selected code and an inline LLM explanation.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="22" x2="1160" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F8F6FF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7657E8"/>
      <stop offset="1" stop-color="#397BE6"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#43337E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="url(#background)" stroke="#E6E7F0" stroke-width="2"/>
  <circle cx="1110" cy="18" r="164" fill="#6BA8FF" opacity="0.07"/>
  <circle cx="635" cy="380" r="220" fill="#8A62EF" opacity="0.05"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="76" y="91" fill="#7057D9" font-size="14" font-weight="700" letter-spacing="2.1">JETBRAINS PLUGIN</text>
    <text x="74" y="157" fill="#17171B" font-size="52" font-weight="700" letter-spacing="-1.4">LLM Syntax</text>
    <text x="74" y="214" fill="#17171B" font-size="52" font-weight="700" letter-spacing="-1.4">Explainer</text>
    <text x="77" y="258" fill="#686873" font-size="19" font-weight="500">选中代码，即刻理解。</text>
    <rect x="76" y="292" width="96" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="684" y="44" width="438" height="272" rx="16" fill="#FFFFFF" stroke="#DADCE7"/>
    <rect x="684" y="44" width="438" height="42" rx="16" fill="#FAFAFC"/>
    <rect x="684" y="70" width="438" height="16" fill="#FAFAFC"/>
    <line x1="684" y1="86" x2="1122" y2="86" stroke="#EAEBF1"/>
    <circle cx="708" cy="65" r="5" fill="#F16B7A"/>
    <circle cx="726" cy="65" r="5" fill="#EAB94F"/>
    <circle cx="744" cy="65" r="5" fill="#50BD82"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
      <text x="712" y="120" fill="#9A9BA6">1</text>
      <text x="746" y="120" fill="#7357DF">fun</text>
      <text x="778" y="120" fill="#3867D6">explain</text>
      <text x="838" y="120" fill="#42434D">(code:</text>
      <text x="891" y="120" fill="#177F72">String</text>
      <text x="943" y="120" fill="#42434D">) {</text>

      <rect x="732" y="137" width="334" height="32" rx="6" fill="#7357DF" opacity="0.08"/>
      <text x="712" y="159" fill="#9A9BA6">2</text>
      <text x="756" y="159" fill="#B04F5C">llm</text>
      <text x="782" y="159" fill="#42434D">.</text>
      <text x="792" y="159" fill="#3867D6">stream</text>
      <text x="845" y="159" fill="#42434D">(code)</text>

      <text x="712" y="199" fill="#9A9BA6">3</text>
      <text x="746" y="199" fill="#42434D">}</text>
    </g>

    <rect x="732" y="218" width="356" height="70" rx="9" fill="#F5F2FF"/>
    <rect x="732" y="218" width="3" height="70" rx="1.5" fill="#7357DF"/>
    <text x="753" y="245" fill="#5D5575" font-family="Inter, ui-sans-serif, sans-serif" font-size="14" font-weight="700">LLM · 正在流式解析</text>
    <rect x="753" y="259" width="282" height="6" rx="3" fill="#8D88A0" opacity="0.46"/>
    <rect x="753" y="274" width="206" height="6" rx="3" fill="#8D88A0" opacity="0.25"/>
    <rect x="1047" y="258" width="3" height="10" rx="1.5" fill="#397BE6"/>
  </g>
</svg>
